<title>Karşılama Aday Kareleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* ═══ Palet — MFSim'in kendi tema token'ları (css/styles.css'ten birebir) ═══
     Açık = "Pearl", koyu = "Slate". Kurulu kare seçicisiyle AYNI sistem:
     iki sayfa aynı işin iki yarısı, ayrı kimlik kurmuyorlar. */
  :root {
    color-scheme: light;
    --bg-primary: #fafbfc;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f1f3;
    --border-color: #e0e2e6;
    --border-light: #e8eaed;
    --border-hover: #c0c4cc;
    --text-primary: #1b1e24;
    --text-secondary: #4e535e;
    --text-muted: #646d7d;
    --text-heading: #0c0e12;
    --accent-primary: #2d6fe6;
    --ink-accent: #1b63e4;
    --accent-success: #1a9a50;
    --ink-success: #157b40;
    --accent-warning: #d49318;
    --ink-warning: #8e6310;
    --accent-danger: #d43d3d;
    --on-accent: #ffffff;
    --on-success: #ffffff;
    --shadow-color: rgba(0, 0, 0, 0.07);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-primary: #0a0c10;
      --bg-secondary: #0f1218;
      --bg-tertiary: #151a22;
      --border-color: #1c2333;
      --border-light: #222b3a;
      --border-hover: #2d3a4f;
      --text-primary: #c8d1dc;
      --text-secondary: #98a0b0;
      --text-muted: #75849d;
      --text-heading: #e2e8f0;
      --accent-primary: #2563eb;
      --ink-accent: #4e80ef;
      --accent-success: #16a34a;
      --ink-success: #2fbe6a;
      --accent-warning: #d97706;
      --ink-warning: #e0a458;
      --accent-danger: #dc2626;
      --on-success: #052812;
      --shadow-color: rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-primary: #0a0c10;
    --bg-secondary: #0f1218;
    --bg-tertiary: #151a22;
    --border-color: #1c2333;
    --border-light: #222b3a;
    --border-hover: #2d3a4f;
    --text-primary: #c8d1dc;
    --text-secondary: #98a0b0;
    --text-muted: #75849d;
    --text-heading: #e2e8f0;
    --accent-primary: #2563eb;
    --ink-accent: #4e80ef;
    --accent-success: #16a34a;
    --ink-success: #2fbe6a;
    --accent-warning: #d97706;
    --ink-warning: #e0a458;
    --accent-danger: #dc2626;
    --on-success: #052812;
    --shadow-color: rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-primary); color: var(--text-primary);
    font: 400 14px/1.5 var(--font-sans);
    -webkit-font-smoothing: antialiased; padding-bottom: 104px;
  }
  a { color: var(--ink-accent); }

  /* ═══ Komut bandı ═══ */
  .band {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
    padding: 13px 22px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px;
  }
  .band h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.15px;
    color: var(--text-heading); text-wrap: balance;
  }
  .band h1 small {
    display: block; font-size: 11.5px; font-weight: 400; color: var(--text-muted);
    margin-top: 3px; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .sayaclar { display: flex; gap: 22px; margin-left: auto; align-items: flex-end; }
  .sayac { display: flex; flex-direction: column; gap: 2px; }
  .sayac .et {
    font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .sayac .dg {
    font-family: var(--font-mono); font-size: 16px; font-weight: 500; line-height: 1.1;
    font-variant-numeric: tabular-nums; color: var(--text-heading);
  }
  .sayac.sec .dg { color: var(--ink-success); }
  .sayac.tavan .dg[data-asti="1"] { color: var(--ink-warning); }

  /* ═══ Araç şeridi ═══ */
  .arac { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; padding: 15px 22px 0; }
  .seg { display: flex; border: 1px solid var(--border-color); border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: var(--bg-secondary); color: var(--text-secondary);
    font: 500 12.5px var(--font-sans); padding: 7px 13px; cursor: pointer;
    border-right: 1px solid var(--border-color);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent-primary); color: var(--on-accent); }
  .seg button:hover[aria-pressed="false"] { background: var(--bg-tertiary); color: var(--text-primary); }
  .seg button:focus-visible { outline: 2px solid var(--ink-accent); outline-offset: -2px; }
  .dugme {
    appearance: none; cursor: pointer; font: 500 13px var(--font-sans);
    padding: 8px 15px; border-radius: 7px; white-space: nowrap;
    background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);
  }
  .dugme:hover { background: var(--bg-tertiary); }
  .dugme:focus-visible { outline: 2px solid var(--ink-accent); outline-offset: 2px; }
  .dugme:disabled { opacity: .45; cursor: default; }
  .ipuc { color: var(--text-muted); font-size: 12.5px; margin-left: auto; }
  .ipuc kbd {
    font-family: var(--font-mono); font-size: 11px; padding: 1px 5px;
    border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-tertiary);
  }

  /* ═══ Bölüm ═══ */
  section { padding: 26px 22px 0; }
  .bas { display: flex; align-items: baseline; gap: 13px; margin-bottom: 13px; }
  .bas h2 {
    margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--text-secondary); white-space: nowrap;
  }
  .bas .cizgi { flex: 1; height: 1px; background: var(--border-color); }
  .bas .adet {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .izgara { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); }

  /* ═══ Aday kartı ═══ */
  .kare {
    position: relative; background: var(--bg-secondary);
    border: 1px solid var(--border-color); border-radius: 9px; overflow: hidden;
    display: flex; flex-direction: column; transition: border-color .13s, box-shadow .13s;
  }
  .kare:hover { border-color: var(--border-hover); box-shadow: 0 3px 12px var(--shadow-color); }
  .secim {
    appearance: none; border: 0; padding: 0; margin: 0; width: 100%;
    background: transparent; color: inherit; font-family: inherit; text-align: left;
    cursor: pointer; display: flex; flex-direction: column; flex: 1;
  }
  .secim:focus-visible { outline: 2px solid var(--ink-accent); outline-offset: -3px; }
  .goz { position: relative; display: block; }
  .goz img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }

  .no {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    height: 26px; line-height: 25px; text-align: center; padding: 0 7px;
    background: var(--bg-secondary); color: var(--text-heading);
    border: 1px solid var(--border-light); border-radius: 6px;
  }
  .buyut {
    position: absolute; top: 8px; right: 8px; z-index: 4;
    width: 28px; height: 26px; padding: 0; cursor: pointer; display: grid; place-items: center;
    background: var(--bg-secondary); color: var(--text-secondary);
    border: 1px solid var(--border-light); border-radius: 6px; font-size: 12px; line-height: 1;
  }
  .buyut:hover { color: var(--ink-accent); border-color: var(--border-hover); }
  .buyut:focus-visible { outline: 2px solid var(--ink-accent); outline-offset: 1px; }

  .kunye { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .kunye .ad { font-size: 13px; font-weight: 500; line-height: 1.38; color: var(--text-heading); }
  .kunye .olcu {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  /* Künye satırı — bu sayfanın kendine özgü bilgisi: kare NEREDEN geliyor */
  .kaynak {
    margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--border-light);
    display: flex; flex-direction: column; gap: 3px;
    font-size: 11px; color: var(--text-muted); line-height: 1.42;
  }
  .kaynak .sat { display: flex; gap: 6px; }
  .kaynak .kv {
    flex: none; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    font-size: 9.5px; color: var(--text-muted); padding-top: 1px; min-width: 44px;
  }
  .kaynak .vv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lis {
    font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--bg-tertiary); border: 1px solid var(--border-light);
    color: var(--text-secondary); flex: none;
  }
  /* Kare başına 560 KB kapısını aşan aday — eklenebilir ama kaliteden düşürmek
     ya da tavanı yükseltmek gerekir; seçim anında görünmesi gerekiyor. */
  .agir {
    font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: .04em;
    padding: 1px 6px; border-radius: 4px; flex: none;
    background: var(--bg-tertiary);   /* color-mix desteklemeyen tarayıcı için */
    background: color-mix(in srgb, var(--accent-warning) 16%, transparent);
    border: 1px solid var(--accent-warning); color: var(--ink-warning);
  }

  .damga {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 3; white-space: nowrap; display: none;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    background: var(--accent-success); color: var(--on-success);
    padding: 5px 11px; border-radius: 5px;
  }
  .kare[data-sec="1"] { border-color: var(--accent-success); box-shadow: 0 0 0 1px var(--accent-success); }
  .kare[data-sec="1"] .damga { display: block; }
  .kare[data-sec="1"] .no { color: var(--ink-success); border-color: var(--accent-success); }
  .kare[data-sec="0"] .goz img { opacity: .88; }

  /* ═══ Karar çubuğu ═══ */
  .karar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--bg-secondary); border-top: 1px solid var(--border-color);
    padding: 11px 22px; display: flex; align-items: center; gap: 13px; flex-wrap: wrap;
  }
  .karar .ozet { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .karar .ozet b {
    color: var(--text-heading); font-family: var(--font-mono); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .karar .ozet .uyari { color: var(--ink-warning); }
  .karar .liste {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-secondary);
    overflow-x: auto; white-space: nowrap; padding: 6px 10px; background: var(--bg-tertiary);
    border: 1px solid var(--border-light); border-radius: 6px; flex: 1; min-width: 170px;
  }
  .durum { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .durum .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .durum[data-d="kayitli"] .nokta { background: var(--accent-success); }
  .durum[data-d="yaziliyor"] .nokta { background: var(--accent-warning); }
  .durum[data-d="hata"] .nokta { background: var(--accent-danger); }
  .durum[data-d="yerel"] .nokta { background: var(--accent-warning); }

  /* ═══ Büyüteç ═══ */
  .perde {
    position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 10, .9);
    display: grid; place-items: center; padding: 24px; overflow: auto;
  }
  /* Sınıf seçicisi tarayıcının [hidden] kuralını ezer — sayfa kendi başına da
     doğru açılsın (yayın kabuğundaki !important bunu maskeliyor). */
  .perde[hidden] { display: none; }
  .perde figure { margin: 0; max-width: min(1180px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .perde img {
    max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain;
    border-radius: 8px; display: block; background: #04060a;
  }
  .perde figcaption { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: #e2e8f0; font-size: 13px; }
  .perde figcaption .m {
    font-family: var(--font-mono); font-size: 11.5px; color: #98a0b0; font-variant-numeric: tabular-nums;
  }
  .perde .eylem {
    appearance: none; cursor: pointer; background: transparent; border: 1px solid #2d3a4f;
    color: #c8d1dc; border-radius: 7px; padding: 7px 13px; font: 500 12.5px var(--font-sans);
  }
  .perde .eylem:hover { background: #151a22; border-color: #4e80ef; }
  .perde .eylem:focus-visible { outline: 2px solid #4e80ef; outline-offset: 2px; }
  .perde .eylem.ilk { margin-left: auto; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 640px) {
    .band { padding: 12px 15px; }
    .sayaclar { margin-left: 0; width: 100%; gap: 18px; flex-wrap: wrap; }
    .ipuc { margin-left: 0; }
    section, .arac { padding-left: 15px; padding-right: 15px; }
    .karar { padding: 10px 15px; }
    body { padding-bottom: 132px; }
  }
</style>

<header class="band">
  <h1>Karşılama Aday Kareleri
    <small id="b-kunye"></small>
  </h1>
  <div class="sayaclar">
    <div class="sayac sec"><span class="et">Seçilen</span><span class="dg" id="s-sec">0</span></div>
    <div class="sayac"><span class="et">Aday</span><span class="dg" id="s-aday">—</span></div>
    <div class="sayac tavan"><span class="et">Klasör olur</span><span class="dg" id="s-boyut">—</span></div>
  </div>
</header>

<div class="arac">
  <div class="seg" role="group" aria-label="Süzgeç">
    <button type="button" data-suz="hepsi" aria-pressed="true">Tümü</button>
    <button type="button" data-suz="sec" aria-pressed="false">Seçilenler</button>
    <button type="button" data-suz="bos" aria-pressed="false">Seçilmeyenler</button>
  </div>
  <button type="button" class="dugme" id="d-sifirla">Seçimi temizle</button>
  <span class="ipuc">Kareye tıkla → eklenecek olarak işaretlenir · <kbd>⤢</kbd> büyütür</span>
</div>

<main id="govde"></main>

<footer class="karar">
  <div class="ozet" id="o-ozet">—</div>
  <div class="liste" id="o-liste">Henüz kare seçilmedi.</div>
  <button type="button" class="dugme" id="d-kopya" disabled>Listeyi kopyala</button>
  <div class="durum" id="o-durum" data-d="bos"><span class="nokta"></span><span id="o-durum-y">Bağlanıyor…</span></div>
</footer>

<div class="perde" id="perde" hidden>
  <figure>
    <img id="p-img" alt="">
    <figcaption>
      <span id="p-ad"></span>
      <span class="m" id="p-m"></span>
      <a class="eylem" id="p-kaynak" href="#" target="_blank" rel="noreferrer noopener">Kaynak sayfa</a>
      <button type="button" class="eylem ilk" id="p-eylem"></button>
      <button type="button" class="eylem" id="p-kapa">Kapat (Esc)</button>
    </figcaption>
  </figure>
</div>

<script>
var ADAYLAR = /*__VERI__*/[];
var DURUM = /*__DURUM__*/{ klasorKb: 0, kareSayisi: 0, tavanKb: 0, kareTavanKb: 0 };

var GRUPLAR = [
  { k: 'gemi', ad: 'Gemi ve donanma' },
  { k: 'toren', ad: 'Tören ve geçit' },
  { k: 'yelken', ad: 'Yelken' }
];

var secilen = new Set();
var suzgec = 'hepsi';
var db = null, damgam = 0, yazZaman = null, acik = null;

var E = function (id) { return document.getElementById(id); };
function kacir(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function kb(n) {
  return n >= 1024 ? (n / 1024).toFixed(2).replace('.', ',') + ' MB' : Math.round(n) + ' KB';
}
function durum(d, y) { E('o-durum').dataset.d = d; E('o-durum-y').textContent = y; }
// a.kb ÖLÇÜLEN webp boyutu (üreteç çevirip saydı), tahmin değil.
function agirMi(a) { return a.kb > DURUM.kareTavanKb; }

// ── çizim ────────────────────────────────────────────────────────────────
function kareHTML(a) {
  var isaretli = secilen.has(a.no);
  return '<div class="kare" data-sec="' + (isaretli ? '1' : '0') + '">' +
    '<button type="button" class="secim" data-no="' + a.no + '" aria-pressed="' + isaretli + '">' +
      '<span class="goz">' +
        '<img src="' + a.src + '" alt="' + kacir(a.baslik) + '" loading="lazy">' +
        '<span class="no">' + a.no + '</span>' +
        '<span class="damga">Eklenecek</span>' +
      '</span>' +
      '<span class="kunye">' +
        '<span class="ad">' + kacir(a.baslik) + '</span>' +
        '<span class="olcu">' + a.w + '×' + a.h + ' · ' + kb(a.kb) +
          (agirMi(a) ? '<span class="agir" title="Kare başına ' + DURUM.kareTavanKb +
            ' KB tavanını aşıyor">tavan üstü</span>' : '') +
          ' <span class="lis">' + kacir(a.lisans) + '</span></span>' +
        '<span class="kaynak">' +
          '<span class="sat"><span class="kv">Sahip</span>' +
            '<span class="vv" title="' + kacir(a.sahip) + '">' + kacir(a.sahip) + '</span></span>' +
          '<span class="sat"><span class="kv">Dosya</span>' +
            '<span class="vv" title="' + kacir(a.commons) + '">' + kacir(a.commons) + '</span></span>' +
        '</span>' +
      '</span>' +
    '</button>' +
    '<button type="button" class="buyut" data-buyut="' + a.no + '" ' +
      'aria-label="' + a.no + ' karesini büyüt">⤢</button>' +
  '</div>';
}

function gecer(a) {
  if (suzgec === 'sec') return secilen.has(a.no);
  if (suzgec === 'bos') return !secilen.has(a.no);
  return true;
}

function ciz() {
  var h = '';
  GRUPLAR.forEach(function (g) {
    var uy = ADAYLAR.filter(function (a) { return a.grup === g.k; });
    var gor = uy.filter(gecer);
    if (!gor.length) return;
    h += '<section><div class="bas"><h2>' + g.ad + '</h2><span class="cizgi"></span>' +
      '<span class="adet">' + gor.length + ' / ' + uy.length + ' aday</span></div>' +
      '<div class="izgara">' + gor.map(kareHTML).join('') + '</div></section>';
  });
  E('govde').innerHTML = h ||
    '<section><p style="color:var(--text-muted)">Bu süzgeçte aday yok.</p></section>';
  sayaclar();
}

function sayaclar() {
  var sec = ADAYLAR.filter(function (a) { return secilen.has(a.no); });
  var ek = sec.reduce(function (t, a) { return t + a.kb; }, 0);
  var olur = DURUM.klasorKb + ek;
  var asti = olur > DURUM.tavanKb;

  E('s-sec').textContent = sec.length;
  E('s-aday').textContent = ADAYLAR.length;
  var bo = E('s-boyut');
  bo.textContent = kb(olur);
  bo.dataset.asti = asti ? '1' : '0';

  E('b-kunye').textContent = 'Wikimedia Commons · klasörde ' + DURUM.kareSayisi +
    ' kare · ' + kb(DURUM.klasorKb);

  var nolar = sec.map(function (a) { return a.no; });
  E('o-liste').textContent = nolar.length ? nolar.join('  ') : 'Henüz kare seçilmedi.';
  E('d-kopya').disabled = !nolar.length;

  E('o-ozet').innerHTML = sec.length
    ? 'Slayt <b>' + (DURUM.kareSayisi + sec.length) + '</b> kare olur · klasör <b>' +
      kb(olur) + '</b>' + (asti
        ? ' <span class="uyari">— ' + kb(DURUM.tavanKb) + ' tavanını aşıyor</span>'
        : '') +
      (sec.filter(agirMi).length
        ? ' <span class="uyari">· ' + sec.filter(agirMi).length +
          ' kare tavan üstü</span>' : '')
    : 'Slayt bugün <b>' + DURUM.kareSayisi + '</b> kare oynatıyor.';
}

// ── seçim ────────────────────────────────────────────────────────────────
function cevir(no) {
  if (secilen.has(no)) secilen.delete(no); else secilen.add(no);
  ciz();
  yaz();
}

function yaz() {
  if (!db) { durum('yerel', 'Yerel — seçim Claude’a ulaşmıyor'); return; }
  durum('yaziliyor', 'Kaydediliyor…');
  clearTimeout(yazZaman);
  yazZaman = setTimeout(function () {
    damgam = Date.now();
    db.doc('aday/secim').set({
      ekle: Array.from(secilen).sort(),
      damga: damgam,
      guncelleme: new Date().toISOString()
    }).then(function () { durum('kayitli', 'Kaydedildi'); })
      .catch(function (e) {
        durum('hata', 'Kaydedilemedi — ' + ((e && e.code) || 'bilinmeyen hata'));
      });
  }, 600);
}

// ── büyüteç ──────────────────────────────────────────────────────────────
function bul(no) {
  return ADAYLAR.filter(function (a) { return a.no === no; })[0] || null;
}
function buyut(no) {
  var a = bul(no);
  if (!a) return;
  acik = no;
  E('p-img').src = a.src;
  E('p-img').alt = a.baslik;
  E('p-ad').textContent = a.no + ' — ' + a.baslik;
  E('p-m').textContent = a.w + '×' + a.h + ' webp ' + kb(a.kb) +
    ' (kaynak ' + a.kaynakW + '×' + a.kaynakH + ') · ' + a.lisans + ' · ' + a.sahip;
  E('p-kaynak').href = a.sayfa || '#';
  E('p-eylem').textContent = secilen.has(no) ? 'Seçimi kaldır' : 'Eklenecek yap';
  E('perde').hidden = false;
  E('p-kapa').focus();
}
function kapat() { E('perde').hidden = true; acik = null; }

// ── db ───────────────────────────────────────────────────────────────────
function baglan(d) {
  db = d;
  durum('kayitli', 'Bağlı');
  d.doc('aday/secim').onSnapshot(function (s) {
    if (!s.exists) return;
    var v = s.data() || {};
    if (v.damga === damgam) return;                 // kendi yazımın yankısı
    secilen = new Set(Array.isArray(v.ekle) ? v.ekle : []);
    ciz();
  }, function (e) { durum('hata', 'Seçim okunamadı — ' + e.code); });
}

// ── kablolama ────────────────────────────────────────────────────────────
E('govde').addEventListener('click', function (ev) {
  var b = ev.target.closest('.buyut');
  if (b) { buyut(b.dataset.buyut); return; }
  var s = ev.target.closest('.secim');
  if (s) cevir(s.dataset.no);
});

document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    suzgec = b.dataset.suz;
    document.querySelectorAll('.seg button').forEach(function (o) {
      o.setAttribute('aria-pressed', String(o === b));
    });
    ciz();
  });
});

E('d-sifirla').addEventListener('click', function () {
  if (!secilen.size) return;
  secilen = new Set();
  ciz(); yaz();
});

E('d-kopya').addEventListener('click', function () {
  var t = E('o-liste').textContent;
  if (!navigator.clipboard) { durum('hata', 'Bu tarayıcı kopyalamaya izin vermiyor'); return; }
  navigator.clipboard.writeText(t).then(
    function () { durum('kayitli', 'Liste kopyalandı'); },
    function () { durum('hata', 'Kopyalanamadı'); }
  );
});

E('p-kapa').addEventListener('click', kapat);
E('perde').addEventListener('click', function (e) { if (e.target === E('perde')) kapat(); });
E('p-eylem').addEventListener('click', function () {
  if (!acik) return;
  cevir(acik);
  buyut(acik);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !E('perde').hidden) kapat();
});

ciz();

if (window.claude && window.claude.use) {
  window.claude.use('db').then(function (d) {
    if (d) baglan(d);
    else durum('yerel', 'Yerel — seçim Claude’a ulaşmıyor');
  }, function () { durum('yerel', 'Yerel — seçim Claude’a ulaşmıyor'); });
} else {
  durum('yerel', 'Yerel — seçim Claude’a ulaşmıyor');
}
</script>
