<title>MFSim Canlı Not</title>
<style>
/* Yerleşim: revizyon masası. Üstte tek satır antet + kalem kutusu, altında
   programın kendisi (iframe); kırmızı kalem programın ÜSTÜNE çizer. Not kartı
   çizimin yanında açılır, kuyruk sağdan gelen bir çekmece. Tek tema, açık. */
:root {
  color-scheme: light;
  --kagit: #f4f3ef;
  --pafta: #ffffff;
  --murekkep: #1b1d20;
  --soluk: #565a61;
  --cizgi: #d9d6cd;
  --cizgi-koyu: #9f9b91;
  --kalem: #c22b22;
  --kalem-zemin: #f7e6e3;
  --mavi: #2a568a;
  --mavi-zemin: #e3ebf5;
  --yesil: #276a45;
  --yesil-zemin: #e2f0e7;
  --amber: #875600;
  --amber-zemin: #f6ecd6;
  --mor: #66479a;
  --mor-zemin: #ece6f5;
  --golge: 0 6px 14px rgba(27, 29, 32, .16);
  --yazi: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --dar: 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  --veri: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --fs-0: 12px;
  --fs-1: 13px;
  --fs-2: 14px;
  --fs-3: 17px;
  --serit-h: 44px;
  --tul: rgba(244, 243, 239, .74);   /* kâğıdın tülü: kilitli programın üstü */
}
html, body { height: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* görünür kural (display:grid/flex) gizliyi ezmesin */
body {
  background: var(--kagit);
  color: var(--murekkep);
  font-family: var(--yazi);
  font-size: var(--fs-2);
  line-height: 1.4;
  overflow: hidden;
}
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mavi); outline-offset: 1px; }

.cn { height: 100%; display: flex; flex-direction: column; }

/* ── antet + kalem kutusu ─────────────────────────────────────────────── */
.cn-serit {
  flex: 0 0 auto;
  min-height: var(--serit-h);
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px;
  padding-block: 5px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--pafta);
  border-bottom: 1px solid var(--cizgi-koyu);
}
.cn-kimlik { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.cn-kimlik b { font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); letter-spacing: .02em; }
.cn-kimlik span.ad { font-family: var(--dar); font-weight: 500; font-size: var(--fs-3); color: var(--kalem); }
.cn-surum { font-family: var(--veri); font-size: var(--fs-0); color: var(--soluk); white-space: nowrap; }
.cn-kimlik .cn-odak { font-family: var(--dar); font-weight: 600; font-size: var(--fs-1); color: var(--mavi); background: var(--mavi-zemin);
  padding: 1px 7px; border-radius: 2px; white-space: nowrap; align-self: center; }
.cn-araclar { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--cizgi); border-radius: 2px; background: var(--kagit); }
.cn-arac {
  width: 32px; height: 30px; display: grid; place-items: center;
  border: 0; border-radius: 2px; background: transparent; color: var(--murekkep); cursor: pointer;
}
.cn-arac svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cn-arac:hover { background: var(--pafta); }
.cn-arac[aria-pressed="true"] { background: var(--murekkep); color: var(--pafta); }
.cn-arac[data-arac]:not([data-arac="imlec"])[aria-pressed="true"] { background: var(--kalem); }
.cn-arac:disabled { color: var(--cizgi-koyu); cursor: default; background: transparent; }
.cn-ayrac { width: 1px; align-self: stretch; margin: 3px 4px; background: var(--cizgi); }
.cn-bosluk { flex: 1 1 auto; }
.cn-durumlar { display: flex; align-items: center; gap: 12px; font-size: var(--fs-1); color: var(--soluk); }
.cn-baglanti { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cn-baglanti::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cizgi-koyu); }
.cn-baglanti[data-d="iyi"]::before { background: var(--yesil); }
.cn-baglanti[data-d="bekle"]::before { background: var(--amber); }
.cn-baglanti[data-d="yok"]::before { background: var(--kalem); }
.cn-ortam { font-size: var(--fs-0); font-weight: 600; color: var(--amber); background: var(--amber-zemin); padding: 2px 6px; border-radius: 2px; }
.cn-dugme {
  height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--cizgi-koyu); border-radius: 2px; background: var(--pafta); cursor: pointer; white-space: nowrap;
}
.cn-dugme:hover { border-color: var(--murekkep); }
.cn-dugme.birincil { background: var(--kalem); border-color: var(--kalem); color: #fff; font-weight: 600; }  /* sabit renk: kalem zemininde beyaz */
.cn-dugme.birincil:hover { background: #a3241c; }  /* sabit renk: kalemin basılı tonu */
.cn-dugme:disabled { opacity: 1; color: var(--soluk); background: var(--kagit); border-color: var(--cizgi); cursor: default; }
.cn-sayac { font-family: var(--veri); font-size: var(--fs-0); min-width: 20px; padding: 1px 5px; border-radius: 2px; background: var(--kagit); text-align: center; }
.cn-sayac[data-bekleyen]:not([data-bekleyen="0"]) { background: var(--amber-zemin); color: var(--amber); }
.cn-dugme.cn-guncel-ac { border-color: var(--amber); background: var(--amber-zemin); color: var(--amber); font-weight: 600; }
.cn-dugme.cn-guncel-ac::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.cn-dugme.cn-guncel-ac:hover { border-color: var(--murekkep); }

/* ── sahne: program + kalem katmanı ───────────────────────────────────── */
.cn-sahne { position: relative; flex: 1 1 auto; min-height: 0; background: var(--pafta); }
.cn-program { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--pafta); }
.cn-cizim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
.cn-cizim.cn-ciz { pointer-events: all; cursor: crosshair; }
.cn-cizim path { fill: none; stroke: var(--kalem); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.cn-cizim .cn-onizleme path { stroke: var(--mavi); stroke-dasharray: 7 5; }
.cn-acilis {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--dar); font-size: var(--fs-3); color: var(--soluk); background: var(--kagit);
}

/* ── kilit: güncelleme isteği sürerken program kullanılamaz ──────────── */
/* program ve kalem katmanı perdenin altında; notlar ve not kartı üstünde */
.cn-kilit { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; background: var(--tul); cursor: progress; }
.cn-kilit-kart {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 12px;
  min-width: 270px; padding: 13px 16px 12px; cursor: default;
  background: var(--pafta); border: 1px solid var(--murekkep); border-top: 3px solid var(--amber); box-shadow: var(--golge);
}
.cn-kilit-kart:focus { outline: none; }
.cn-kilit-don { grid-row: span 2; width: 22px; height: 22px; border: 2px solid var(--cizgi); border-top-color: var(--amber); border-radius: 50%; }
.cn-kilit-kart b { font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); white-space: nowrap; }
.cn-kilit-asama { font-family: var(--veri); font-size: var(--fs-0); color: var(--soluk); white-space: nowrap; }
.cn-kilit-kart .cn-dugme { grid-column: 1 / -1; justify-self: end; margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .cn-kilit-don { animation: cn-don .9s linear infinite; }
  @keyframes cn-don { to { transform: rotate(360deg); } }
}

/* ── not kartı ───────────────────────────────────────────────────────── */
.cn-kart {
  position: absolute; z-index: 3; width: 340px; max-width: calc(100% - 24px);
  display: grid; gap: 8px; padding: 10px 12px 12px;
  background: var(--pafta); border: 1px solid var(--murekkep); border-top: 3px solid var(--kalem);
  box-shadow: var(--golge);
}
.cn-kart-bas { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.cn-no { font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); color: var(--kalem); white-space: nowrap; }
.cn-yer { font-size: var(--fs-1); color: var(--soluk); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cn-kart textarea, .cn-yanit textarea, .cn-sor input {
  width: 100%; resize: vertical; min-height: 76px; padding: 7px 9px;
  border: 1px solid var(--cizgi-koyu); border-radius: 2px; background: var(--pafta); line-height: 1.45;
}
.cn-sor input { min-height: 0; height: 32px; }
.cn-kart textarea:focus, .cn-yanit textarea:focus, .cn-sor input:focus { outline: 2px solid var(--mavi); outline-offset: -1px; border-color: var(--mavi); }
.cn-kart-alt { display: flex; align-items: center; gap: 8px; }
.cn-kart-durum { flex: 1 1 auto; min-width: 0; font-size: var(--fs-1); color: var(--soluk); }
.cn-kart-durum[data-d="hata"] { color: var(--kalem); }

/* ── programın onay sorusu (confirm / prompt yerine) ─────────────────── */
.cn-sor {
  position: absolute; z-index: 4; top: 14px; left: 50%; transform: translateX(-50%);
  width: min(520px, calc(100% - 24px)); display: grid; gap: 10px; padding: 12px 14px;
  background: var(--pafta); border: 1px solid var(--murekkep); box-shadow: var(--golge);
}
.cn-sor p { margin: 0; }
.cn-sor-dugme { display: flex; justify-content: flex-end; gap: 8px; }

/* ── güncelleme penceresi: yeni program kayıtta; Güncelle yükler ─────── */
.cn-guncel {
  position: absolute; z-index: 4; top: 14px; right: 14px; width: min(380px, calc(100% - 28px));
  display: grid; gap: 8px; padding: 11px 14px 12px;
  background: var(--pafta); border: 1px solid var(--murekkep); border-top: 3px solid var(--amber); box-shadow: var(--golge);
}
.cn-liste:not([hidden]) ~ .cn-guncel { right: calc(min(380px, 100%) + 14px); }
.cn-guncel-bas { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.cn-guncel-bas b { font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); }
.cn-guncel-surum { font-family: var(--veri); font-size: var(--fs-0); color: var(--soluk); white-space: nowrap; }
.cn-guncel p { margin: 0; font-size: var(--fs-1); color: var(--soluk); }
.cn-guncel p:empty { display: none; }

/* ── kuyruk çekmecesi ────────────────────────────────────────────────── */
.cn-liste {
  position: absolute; z-index: 2; top: 0; right: 0; bottom: 0; width: min(380px, 100%);
  display: flex; flex-direction: column;
  background: var(--kagit); border-left: 1px solid var(--cizgi-koyu); box-shadow: var(--golge);
}
.cn-liste-bas {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px;
  border-bottom: 1px solid var(--cizgi); background: var(--pafta);
}
.cn-liste-bas h2 { margin: 0; font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); }
.cn-ozet { flex: 1 1 auto; font-size: var(--fs-1); color: var(--soluk); font-variant-numeric: tabular-nums; }
.cn-notlar { margin: 0; padding: 0 0 10px; overflow-y: auto; flex: 1 1 auto; }
.cn-bos { margin: 0; padding: 18px 14px; color: var(--soluk); display: grid; gap: 4px; }
/* Kategoriler: notun durumundan türeyen bölümler (çekirdek: kategorile). Başlık
   yapışkan, tıklanınca bölüm kapanır; boş kategori başlığıyla kalır (sayı 0). */
.cn-kat-bas { position: sticky; top: 0; z-index: 1; margin: 0; background: var(--kagit); border-bottom: 1px solid var(--cizgi); }
.cn-kat-bas button {
  width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 14px 8px 12px;
  border: 0; background: transparent; cursor: pointer; text-align: left;
  font-family: var(--dar); font-weight: 600; font-size: var(--fs-3); color: var(--murekkep);
}
.cn-kat-bas button::before {
  content: ""; width: 6px; height: 6px; flex: none; transform: rotate(45deg) translate(-1px, -1px);
  border-right: 1.7px solid currentColor; border-bottom: 1.7px solid currentColor;
}
.cn-kat[data-kapali="1"] .cn-kat-bas button::before { transform: rotate(-45deg); }
.cn-kat-bas button:hover:not(:disabled) { background: var(--pafta); }
.cn-kat-bas button:disabled { cursor: default; color: var(--soluk); }
.cn-kat-bas button:disabled::before { opacity: .35; }
.cn-kat-say { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: 2px; text-align: center;
  font-family: var(--veri); font-weight: 400; font-size: var(--fs-0); background: var(--pafta); color: var(--soluk); }
.cn-kat[data-bos="0"][data-kat="girdi"] .cn-kat-say { background: var(--mor-zemin); color: var(--mor); }
.cn-kat[data-bos="0"][data-kat="uygulaniyor"] .cn-kat-say { background: var(--mavi-zemin); color: var(--mavi); }
.cn-kat[data-bos="0"][data-kat="uygulanacak"] .cn-kat-say { background: var(--amber-zemin); color: var(--amber); }
.cn-kat[data-bos="0"][data-kat="uygulanan"] .cn-kat-say { background: var(--yesil-zemin); color: var(--yesil); }
.cn-kat-liste { list-style: none; margin: 0; padding: 10px; display: grid; gap: 8px; }
.cn-kat[data-bos="1"] .cn-kat-liste, .cn-kat[data-kapali="1"] .cn-kat-liste { display: none; }
.cn-not {
  display: grid; gap: 6px; padding: 9px 10px 10px;
  background: var(--pafta); border: 1px solid var(--cizgi); border-left: 3px solid var(--amber);
}
.cn-not[data-durum="uygulaniyor"] { border-left-color: var(--mavi); }
.cn-not[data-durum="uygulandi"] { border-left-color: var(--yesil); }
.cn-not[data-durum="soru"] { border-left-color: var(--mor); }
.cn-not[data-durum="iptal"] { border-left-color: var(--cizgi-koyu); }
.cn-not[data-durum="iptal"] .cn-not-metin { color: var(--soluk); text-decoration: line-through; }
.cn-not-bas { display: flex; align-items: center; gap: 8px; }
.cn-not-bas .cn-no { font-size: var(--fs-2); }
.cn-not-bas time { margin-left: auto; font-family: var(--veri); font-size: var(--fs-0); color: var(--soluk); }
.cn-not-yer { margin: 0; font-size: var(--fs-1); color: var(--soluk); }
.cn-not-metin { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.cn-cevap { display: grid; gap: 2px; padding: 6px 8px; background: var(--kagit); border-left: 2px solid var(--cizgi-koyu); }
.cn-cevap b { font-family: var(--dar); font-weight: 600; font-size: var(--fs-1); color: var(--soluk); }
.cn-cevap p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.cn-not-alt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cn-not-alt .cn-dugme { height: 26px; padding: 0 9px; font-size: var(--fs-1); }
.cn-not-alt .cn-iz { margin-left: auto; font-family: var(--veri); font-size: var(--fs-0); color: var(--soluk); }
.cn-yanit { display: grid; gap: 6px; }
.cn-yanit textarea { min-height: 54px; }
/* Sonucun görüntüsü (Claude çeker): satırda küçük, tıklanınca büyük */
.cn-sonuc { display: block; width: 100%; padding: 0; border: 1px solid var(--cizgi); border-radius: 2px; background: var(--kagit); cursor: zoom-in; overflow: hidden; }
.cn-sonuc:hover { border-color: var(--cizgi-koyu); }
.cn-sonuc img { display: block; width: 100%; height: auto; }
.cn-buyuk {
  position: absolute; z-index: 6; inset: 0; display: grid; place-items: center; padding: 20px;
  background: rgba(27, 29, 32, .55);  /* sabit renk: mürekkebin tülü, tek tema */
}
.cn-buyuk figure {
  margin: 0; max-width: 100%; max-height: 100%; display: grid; gap: 8px; padding: 10px 10px 8px;
  background: var(--pafta); box-shadow: var(--golge);
}
.cn-buyuk img { display: block; max-width: min(1600px, calc(100vw - 60px)); max-height: calc(100vh - 150px); width: auto; height: auto; object-fit: contain; }
.cn-buyuk figcaption { display: flex; align-items: center; gap: 10px; font-size: var(--fs-1); color: var(--soluk); }
.cn-buyuk figcaption b { font-family: var(--dar); font-weight: 600; font-size: var(--fs-2); color: var(--kalem); }
.cn-buyuk figcaption span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cn-bildirim {
  position: absolute; z-index: 5; left: 50%; bottom: 18px; transform: translateX(-50%);
  max-width: calc(100% - 24px); padding: 8px 14px; background: var(--murekkep); color: var(--pafta);
  font-size: var(--fs-1); box-shadow: var(--golge); pointer-events: none;
}
.cn-gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .cn-liste:not([hidden]) { animation: cn-gel .14s ease-out; }
  @keyframes cn-gel { from { transform: translateX(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 720px) { .cn-surum, .cn-durumlar { display: none; } }
</style>

<div class="cn" id="cn">
  <header class="cn-serit">
    <div class="cn-kimlik"><b>MFSim</b><span class="ad">Canlı Not</span><span class="cn-odak" id="cn-odak" hidden></span><span class="cn-surum" id="cn-surum"></span></div>
    <div class="cn-araclar" role="toolbar" aria-label="Kalem">
      <button class="cn-arac" type="button" data-arac="imlec" aria-pressed="true" title="İmleç (Esc)" aria-label="İmleç">
        <svg viewBox="0 0 24 24"><path d="M6 3.5 18.5 13l-5.6.9 3.2 6.1-2.4 1.2-3.2-6.1L6 19z"/></svg></button>
      <button class="cn-arac" type="button" data-arac="kalem" aria-pressed="false" title="Kalem (Alt+N)" aria-label="Kalem">
        <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.6 5a2.1 2.1 0 0 1 3 0l.4.4a2.1 2.1 0 0 1 0 3L8.6 18.8z"/><path d="M13.5 7.1l3.4 3.4"/></svg></button>
      <button class="cn-arac" type="button" data-arac="daire" aria-pressed="false" title="Daire" aria-label="Daire">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
      <button class="cn-arac" type="button" data-arac="ok" aria-pressed="false" title="Ok" aria-label="Ok">
        <svg viewBox="0 0 24 24"><path d="M5 19 18 6M10 6h8v8"/></svg></button>
      <button class="cn-arac" type="button" data-arac="kutu" aria-pressed="false" title="Kutu" aria-label="Kutu">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="12"/></svg></button>
      <span class="cn-ayrac" aria-hidden="true"></span>
      <button class="cn-arac" type="button" id="cn-geri" title="Son çizgiyi sil (Ctrl+Z)" aria-label="Son çizgiyi sil" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/></svg></button>
    </div>
    <span class="cn-bosluk"></span>
    <div class="cn-durumlar">
      <span class="cn-ortam" id="cn-ortam" hidden>Ortam farkı</span>
      <span class="cn-baglanti" id="cn-kayit" data-d="bekle">Kayıt</span>
      <span class="cn-baglanti" id="cn-claude" data-d="bekle">Claude</span>
    </div>
    <button class="cn-dugme cn-guncel-ac" type="button" id="cn-guncel-ac" aria-controls="cn-guncel" hidden>Güncelleme</button>
    <button class="cn-dugme" type="button" id="cn-istek" title="Ana dalın son programını iste">Programı güncelle</button>
    <button class="cn-dugme" type="button" id="cn-yenile" title="Programı yeniden yükle">Yenile</button>
    <button class="cn-dugme" type="button" id="cn-cagir" title="Sayfaya bağlı Claude oturumunu uyandır">Oturumu çağır</button>
    <button class="cn-dugme" type="button" id="cn-liste-ac" aria-expanded="false" aria-controls="cn-liste">Notlar <span class="cn-sayac" id="cn-sayac" data-bekleyen="0">0</span></button>
  </header>

  <main class="cn-sahne" id="cn-sahne">
    <iframe class="cn-program" id="cn-program" title="MFSim"></iframe>
    <div class="cn-acilis" id="cn-acilis">MFSim açılıyor…</div>
    <svg class="cn-cizim" id="cn-cizim" aria-hidden="true"><g class="cn-onizleme" id="cn-onizleme"></g><g id="cn-taslak"></g></svg>

    <div class="cn-kilit" id="cn-kilit" hidden>
      <div class="cn-kilit-kart" id="cn-kilit-kart" role="status" aria-live="polite" tabindex="-1">
        <span class="cn-kilit-don" aria-hidden="true"></span>
        <b>Program güncelleniyor</b>

    <form class="cn-kart" id="cn-kart" hidden>
      <div class="cn-kart-bas"><span class="cn-no" id="cn-kart-no">Not</span><span class="cn-yer" id="cn-kart-yer"></span></div>
      <label class="cn-gizli" for="cn-metin">Not</label>

        <span class="cn-kart-durum" id="cn-kart-durum" role="status"></span>

        <button class="cn-dugme" type="button" id="cn-sor-hayir">Vazgeç</button>
        <button class="cn-dugme birincil" type="button" id="cn-sor-evet">Tamam</button>

    <aside class="cn-liste" id="cn-liste" aria-label="Notlar" hidden>
      <div class="cn-liste-bas">
        <h2>Notlar</h2><span class="cn-ozet" id="cn-ozet"></span>
        <button class="cn-arac" type="button" id="cn-liste-kapat" aria-label="Kapat" title="Kapat">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="cn-notlar" id="cn-notlar"></div>
      <p class="cn-bos" id="cn-bos"><span>Not yok.</span><span>Kalemle ekranda bir yeri işaretleyin.</span></p>
    </aside>

    <div class="cn-guncel" id="cn-guncel" role="dialog" aria-modal="false" aria-labelledby="cn-guncel-bas" hidden>
      <div class="cn-guncel-bas"><b id="cn-guncel-bas">Güncelleme</b><span class="cn-guncel-surum" id="cn-guncel-surum"></span></div>
      <p id="cn-guncel-not"></p>
      <div class="cn-sor-dugme">
        <button class="cn-dugme" type="button" id="cn-guncel-notlar">Notlar</button>
        <button class="cn-dugme" type="button" id="cn-guncel-sonra">Sonra</button>
        <button class="cn-dugme birincil" type="button" id="cn-guncel-evet">Güncelle</button>

    <div class="cn-buyuk" id="cn-buyuk" role="dialog" aria-modal="true" aria-labelledby="cn-buyuk-no" hidden>
      <figure>
        <img id="cn-buyuk-resim" alt="">
        <figcaption><b id="cn-buyuk-no"></b><span id="cn-buyuk-yer"></span>
          <button class="cn-arac" type="button" id="cn-buyuk-kapat" aria-label="Kapat" title="Kapat (Esc)">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></figcaption>
      </figure>
    </div>

    <div class="cn-bildirim" id="cn-bildirim" role="status" hidden></div>
  </main>
</div>

<script>/*__CEKIRDEK__*/</script>
<script>
(function () {
  'use strict';
  // Yazı tipi betikten EKLENİR: işaretlemedeki <link> ağ takılınca ardındaki
  // betikleri bekletiyor (ölçüldü: yanıtsız ağda sayfa hiç kurulmadı).
  try {
    var yt = document.createElement('link');
    yt.rel = 'stylesheet';
    yt.href = 'https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap';
    document.head.appendChild(yt);
  } catch (e) { /* yedek yığın */ }
  var AYAR = /*__AYAR__*/null || {};
  var CN = window.CanliNot;
  var $ = function (id) { return document.getElementById(id); };
  var cerceve = $('cn-program'), katman = $('cn-cizim'), taslakG = $('cn-taslak'), onizG = $('cn-onizleme');
  var kart = $('cn-kart'), metinEl = $('cn-metin'), gonderBtn = $('cn-gonder');
  var NS = 'http://www.w3.org/2000/svg';

  var yetki = { db: null, comments: null, assets: null, downloads: null };
  var kayitDurum = 'bekle', claudeDurum = 'bekle';
  var program = { basladi: false, hazir: false, ortam: null, kaynak: '', bilgi: null, yuklenen: '', surum: '', pr: '' };
  var notlar = [], oncekiDurum = {}, ilkListe = true;
  var arac = 'imlec', cizilen = null;
  var taslak = { sekiller: [], secim: null, baglam: null, surum: 0 };
  var onceki = {};

  // Şeritteki sürüm AÇIK programınki (kayıttaki yayın); sayfanın kendi künyesi ipucunda.
  function surumYaz() {
    $('cn-surum').textContent = [program.surum, program.pr ? '#' + program.pr : ''].filter(Boolean).join(' · ');
  }
  surumYaz();
  if (AYAR.surum) $('cn-surum').title = 'Sayfa ' + AYAR.surum + (AYAR.pr ? ' · #' + AYAR.pr : '');
  // ODAK (kullanıcı 2026-11-11: bir bileşene ayrılmış Canlı Not): şeritte bileşenin adı;
  // program her açılışta o bileşende açılır (odakla), notlar sayfanın aralığında numaralanır.
  var ODAK = CN.odakBul(AYAR.odak);
  if (ODAK) { $('cn-odak').textContent = ODAK.ad; $('cn-odak').hidden = false; }

  // ── bildirim ────────────────────────────────────────────────────────────
  var bildirimZaman = 0;
  function bildir(metin) {
    var el = $('cn-bildirim');
    el.textContent = metin; el.hidden = false;
    clearTimeout(bildirimZaman);
    bildirimZaman = setTimeout(function () { el.hidden = true; }, 3200);
  }

  // ── bağlantı durumu ─────────────────────────────────────────────────────
  function durumYaz() {
    var k = $('cn-kayit'), c = $('cn-claude');
    var kd = { bagli: 'iyi', bekle: 'bekle', yok: 'yok', hata: 'yok' }[kayitDurum] || 'bekle';
    k.setAttribute('data-d', kd);
    k.title = kayitDurum === 'bagli' ? 'Kayıt bağlı.' : kayitDurum === 'bekle' ? 'Kayda bağlanıyor…' : 'Kayıt bu görünümde kapalı.';
    var cd = claudeDurum === 'available' ? 'iyi' : claudeDurum === 'bekle' ? 'bekle' : claudeDurum === 'no_session' ? 'bekle' : 'yok';
    c.setAttribute('data-d', cd);
    c.title = claudeDurum === 'available' ? 'Notlar Claude oturumuna gider.'
      : claudeDurum === 'bekle' ? 'Claude yoklanıyor…'
      : claudeDurum === 'no_session' ? 'Claude oturumu bağlı değil; notlar kayıtta bekler.'
      : 'Claude’a gönderim kapalı; notlar kayıtta bekler.';
    var o = program.ortam, fark = [];
    if (o && o.eval === false) fark.push('eval kapalı');
    if (!yetki.downloads && program.hazir) fark.push('indirme kapalı');
    var oe = $('cn-ortam');
    oe.hidden = !fark.length;
    oe.title = fark.join(' · ');
  }

  function claudeYokla() {
    var c = yetki.comments;
    if (!c || typeof c.canSendToClaude !== 'function') { claudeDurum = 'off'; durumYaz(); return Promise.resolve(claudeDurum); }
    return c.canSendToClaude().then(function (v) { claudeDurum = v; durumYaz(); return v; },
      function () { claudeDurum = 'off'; durumYaz(); return claudeDurum; });
  }

  function yetkileriAl() {
    if (!window.claude || typeof window.claude.use !== 'function') {
      kayitDurum = 'yok'; claudeDurum = 'off'; durumYaz(); programBaslat(); return;
    }
    window.claude.use('db').then(function (db) {
      yetki.db = db;
      if (!db) { kayitDurum = 'yok'; durumYaz(); programBaslat(); return; }
      dbBagla();
    }, function () { kayitDurum = 'yok'; durumYaz(); programBaslat(); });
    window.claude.use('comments').then(function (c) { yetki.comments = c; claudeYokla(); },
      function () { claudeDurum = 'off'; durumYaz(); });
    window.claude.use('assets').then(function (a) { yetki.assets = a; }, function () {});
    window.claude.use('downloads').then(function (d) { yetki.downloads = d; durumYaz(); }, function () {});
  }

  function dbBagla() {
    var zaman = setTimeout(function () { if (kayitDurum === 'bekle') { kayitDurum = 'hata'; durumYaz(); } }, 10000);
    yetki.db.collection('notlar').orderBy('sira').onSnapshot(function (snap) {
      clearTimeout(zaman);
      kayitDurum = 'bagli';
      notlar = snap.docs.map(function (d) { var v = d.data() || {}; var n = {}; for (var k in v) n[k] = v[k]; n.id = d.id; return n; });
      listeCiz();
      durumYaz();
    }, function () { clearTimeout(zaman); kayitDurum = 'hata'; durumYaz(); });
    // Programın yayını: açılışta en yeniyi seçer, sonra gelen yayını sorar.
    var yzaman = setTimeout(programBaslat, 4000);
    yetki.db.doc('yayin/son').onSnapshot(function (snap) {
      clearTimeout(yzaman);
      yayinOkundu = true;
      yayin = snap.exists ? (snap.data() || null) : null;
      if (!program.kaynak) programBaslat(); else guncellemeDenetle();
    }, function () { clearTimeout(yzaman); programBaslat(); });
    yetki.db.doc('istek/guncelle').onSnapshot(istekGeldi, function () {});
    // Oturumu çağır: son çağrı ve oturumun geldiğini söyleyen sahiplik kaydı.
    yetki.db.doc('oturum/cagri').onSnapshot(function (snap) {
      cagri = snap && snap.exists ? (snap.data() || null) : null; cagriCiz();
    }, function () {});
    yetki.db.doc('oturum/aktif').onSnapshot(aktifGeldi, function () {});
  }

  // ── program: kaynağı ve güncellemesi ────────────────────────────────────
  // Program KAYITTAKİ yayındır (yayin/son); sayfa program gömmez. Parçalı yayında
  // (çekirdek: yuvaPlani · programBirlestir) her yuva ayrı varlıktır: sayfa yuvaları
  // indirir, açar, birleştirir ve çerçeveye koyar. Açılmış yuva bu görünümün ömrünce
  // bellekte kalır — güncellemede yalnız DEĞİŞEN yuva indirilir. Açıkken gelen yayın
  // programı KENDİLİĞİNDEN değiştirmez: pencere sorar, Güncelle yükler; proje taşınır.
  var yayin = null, yayinOkundu = false, ertelenen = '';
  var yuvaBellek = {};                       // yuvanın özeti → açılmış metni
  function acilisYaz(metin) { var el = $('cn-acilis'); el.textContent = metin; el.hidden = false; }
  function programBaslat() {
    if (program.kaynak || program.yuklenen) return;
    var k = CN.programKaynagi(yayin);
    if (k.tur === 'yok') {
      acilisYaz(kayitDurum === 'yok' || kayitDurum === 'hata' ? 'Kayıt bağlı değil.' : (yayinOkundu ? 'Program yayını yok.' : 'Kayıt bekleniyor…'));
      return;
    }
    programYukle(k, null).then(guncellemeDenetle, function () { acilisYaz('Program indirilemedi.'); });
  }
  function getir(id) {
    return fetch('/_blob/' + id).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  }
  // Saklanan biçim → metin: gzip'li yuva taban64'ten açılır (tarayıcının akışı).
  function yuvaAc(sik, veri) {
    if (sik !== 'gzip') return Promise.resolve(veri);
    if (typeof DecompressionStream !== 'function') return Promise.reject(new Error('sıkıştırma açılamıyor'));
    var ikili = atob(veri), b = new Uint8Array(ikili.length);
    for (var i = 0; i < ikili.length; i++) b[i] = ikili.charCodeAt(i);
    return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function yuvaAnahtari(yuva) { return yuva[0].ozet || yuva.map(function (p) { return p.id; }).join('+'); }
  function yuvaGetir(yuva, bitti) {
    var anahtar = yuvaAnahtari(yuva);
    if (typeof yuvaBellek[anahtar] === 'string') { yuva.forEach(bitti); return Promise.resolve(yuvaBellek[anahtar]); }
    return Promise.all(yuva.map(function (p) { return getir(p.id).then(function (m) { bitti(); return m; }); }))
      .then(function (m) { return yuvaAc(yuva[0].sik, m.join('')); })
      .then(function (metin) { yuvaBellek[anahtar] = metin; return metin; });
  }
  function programGetir(k) {
    if (k.tur === 'varlik') return getir(k.id);            // eski biçim: tek varlık
    var plan = CN.yuvaPlani(k.parcalar), biten = 0, toplam = k.parcalar.length;
    var bitti = function () { biten++; if (!program.kaynak) acilisYaz('MFSim indiriliyor · ' + biten + '/' + toplam); };
    return Promise.all(plan.map(function (yuva) { return yuvaGetir(yuva, bitti); })).then(function (yuvalar) {
      var html = CN.programBirlestir(yuvalar);
      if (k.uzunluk && html.length !== k.uzunluk) throw new Error('program eksik');
      var tutulan = {};                                    // bu yayında olmayan yuva bellekten düşer
      plan.forEach(function (yuva) { tutulan[yuvaAnahtari(yuva)] = true; });
      Object.keys(yuvaBellek).forEach(function (a) { if (!tutulan[a]) delete yuvaBellek[a]; });
      return html;
    });
  }
  function programYukle(k, proje) {
    program.yuklenen = k.surum || '?';
    if (!program.kaynak) acilisYaz('MFSim indiriliyor…');
    return programGetir(k).then(function (html) {
      if (!/^\s*<!doctype html/i.test(html)) throw new Error('program değil');
      program.basladi = false; program.hazir = false;
      program.kaynak = k.tur; program.bilgi = k; program.surum = k.surum; program.pr = k.pr || '';
      if (proje) onceki.proje = proje;
      acilisYaz('MFSim açılıyor…');
      surumYaz(); durumYaz();
      cerceve.srcdoc = html;
      program.yuklenen = '';
    }, function (hata) { program.yuklenen = ''; throw hata; });
  }
  function guncellemeDenetle() {
    if (program.yuklenen) return;                          // yükleme sürerken sorulmaz; bitince yeniden bakılır
    if (!program.kaynak) { programBaslat(); return; }      // program yokken gelen yayın yüklenir
    // Düğmeyle istenen güncelleme gelince sorulmaz, yüklenir (kullanıcı zaten istedi).
    if (istekBekle && CN.guncellemeVar(yayin, program.surum, '')) {
      istekBekle = false; guncelle(); return;
    }
    $('cn-guncel-ac').hidden = !CN.guncellemeVar(yayin, program.surum, '');
    if (CN.guncellemeVar(yayin, program.surum, ertelenen)) guncelAc();
    else if (!CN.guncellemeVar(yayin, program.surum, '')) guncelKapat();
  }
  function guncelAc() {
    if (!yayin) return;
    $('cn-guncel-surum').textContent = [yayin.surum, yayin.pr ? '#' + yayin.pr : ''].filter(Boolean).join(' · ');
    var nolar = CN.noAraligi(yayin.notlar || []);
    $('cn-guncel-not').textContent = nolar ? 'Not ' + nolar + ' uygulandı' : '';
    $('cn-guncel-evet').disabled = false;
    $('cn-guncel').hidden = false;
  }
  function guncelKapat() { $('cn-guncel').hidden = true; }
  function guncelle() {
    var k = CN.programKaynagi(yayin), btn = $('cn-guncel-evet');
    if (k.tur === 'yok' || program.yuklenen) return;
    btn.disabled = true;
    yukleKilitle(k.surum);                    // proje şimdi alınır: yeni program açılana dek kilitli
    programYukle(k, programProjesi()).then(function () {
      ertelenen = ''; guncelKapat(); $('cn-guncel-ac').hidden = true;
      bildir('Program güncellendi · ' + k.surum);
      guncellemeDenetle();
    }, function () { yukleKilitle(''); btn.disabled = false; bildir('Güncelleme indirilemedi.'); });
  }
  // YENİLE (kullanıcı 2026-11-05: *"canlı not içine yenileme butonu ekler misin … F5
  // yapıp sayfayı tamamen yenilemek istemiyorum"*): yalnız program yeniden yüklenir,
  // sayfa (notlar, çizim, kart) yerinde; açık proje taşınır. Yeni yayın varsa o yüklenir.
  function programProjesi() {
    try {
      var w = cerceve.contentWindow, f = w && w._veSettingsBuildProjectData;
      if (program.hazir && typeof f === 'function') return f();
    } catch (e) { /* çerçeveye erişim yok */ }
    return null;
  }
  function yenile() {
    if (CN.guncellemeVar(yayin, program.surum, '')) { guncelle(); return; }
    if (!program.bilgi) { programBaslat(); return; }
    programYukle(program.bilgi, programProjesi())
      .then(function () { bildir('Program yenilendi.'); }, function () { bildir('Program indirilemedi.'); });
  }
  // PROGRAMI GÜNCELLE (kullanıcı 2026-11-11: *"Canlı notun içine de belli bir yere programı
  // güncelleyen bir buton koyalım"*): Güncelleme yalnız bir oturumun YAYINLADIĞINI yükler;
  // bu düğme ana dalın SON hâlini (başka oturumların birleşmeleri dâhil) ister — kayda
  // istek (istek/guncelle) ve Claude'a yorum. Oturum derleyip yayınlar; yeni yayın gelince
  // sayfa onu sormadan yükler (proje taşınır). Yayın zaten ana dalsa "güncel" der.
  var istek = null, istekBekle = false;
  function istekCiz() {
    var b = $('cn-istek'), d = CN.istekDurumu(istek, Date.now());
    var surer = d === 'bekliyor' || d === 'yapiliyor';
    b.disabled = surer;
    b.setAttribute('aria-busy', surer ? 'true' : 'false');
    b.textContent = surer ? 'Güncelleniyor…' : 'Programı güncelle';
    kilitCiz();
  }
  // KİLİT (kullanıcı 2026-11-11: *"'güncelleniyor' yazısı çıkıyor butonda. Böyle olduğu zaman
  // programı kilitlemesini istiyorum"*): istek sürerken ve yeni program açılana dek program
  // perdenin altında ve `inert` (fare, klavye, odak); Yenile kapalı. Notlar ve not kartı
  // açık kalır. Vazgeç isteği bırakır; istek eskiyince (30 dk) kilit kendiliğinden açılır.
  var yukleniyor = '', yukleZaman = null, kilitZaman = null;
  function kilitCiz() {
    var k = CN.kilitDurumu(istek, Date.now(), yukleniyor);
    $('cn-kilit').hidden = !k.kilitli;
    $('cn-kilit-asama').textContent = k.metin;
    $('cn-kilit-vazgec').hidden = k.asama === 'yukleme';
    cerceve.toggleAttribute('inert', k.kilitli);
    $('cn-yenile').disabled = k.kilitli;
    if (k.kilitli) kilitOdak();
    clearTimeout(kilitZaman);
    if (k.kalan > 0) kilitZaman = setTimeout(istekCiz, k.kalan + 100);
  }
  // inert programın kendi focus() çağrısını durdurmuyor: odak programa girerse karta döner
  // (yazılan not kartında kalır).
  function kilitOdak() {
    if (!$('cn-kilit').hidden && document.activeElement === cerceve) $('cn-kilit-kart').focus({ preventScroll: true });
  }
  window.addEventListener('blur', function () { setTimeout(kilitOdak, 0); });
  function yukleKilitle(surum) {
    yukleniyor = surum || '';
    clearTimeout(yukleZaman);
    if (yukleniyor) yukleZaman = setTimeout(function () { yukleKilitle(''); }, 180000);   // program hiç açılmazsa
    kilitCiz();
  }
  function istekBirak() {
    if (!yetki.db) return;
    istekBekle = false;
    istek = { durum: 'iptal', zaman: new Date().toISOString(), konu: istek && istek.konu };
    istekCiz();
    yetki.db.doc('istek/guncelle').update({ durum: 'iptal', zaman: istek.zaman })
      .then(function () { bildir('İstek bırakıldı.'); }, function () { bildir('İstek bırakılamadı.'); });
  }
  function istekGeldi(snap) {
    var once = CN.istekDurumu(istek, Date.now());
    istek = snap && snap.exists ? (snap.data() || null) : null;
    var d = CN.istekDurumu(istek, Date.now());
    istekCiz();
    if (!istekBekle || d === once) return;
    if (d === 'tamam' || d === 'guncel') {
      // İstenen ana dalın son hâli: açık program kayıttaki yayından eskiyse o yüklenir.
      if (CN.guncellemeVar(yayin, program.surum, '')) { guncellemeDenetle(); return; }
      if (d === 'guncel') { istekBekle = false; bildir('Program güncel · ' + (istek.surum || program.surum)); return; }
      setTimeout(function () { istekBekle = false; }, 20000);   // yayın önce yazılır (skill §1); gecikirse gelince yüklenir
    }
    else if (d === 'hata') { istekBekle = false; bildir('Güncellenemedi' + (istek.cevap ? ': ' + istek.cevap : '.')); }
    else if (d === 'iptal') istekBekle = false;
  }
  function istekGonder() {
    if (!yetki.db) { bildir('Kayıt bağlı değil.'); return; }
    var zaman = new Date().toISOString();
    istekBekle = true;
    istek = { durum: 'bekliyor', zaman: zaman, sayfaSurum: program.surum || '' };
    istekCiz();
    yetki.db.doc('istek/guncelle').set({ durum: 'bekliyor', zaman: zaman, sayfaSurum: program.surum || '', cevap: '' })
      .then(function () {
        var c = yetki.comments;
        if (!c || typeof c.sendToClaude !== 'function' || claudeDurum !== 'available') {
          bildir('Claude oturumu bağlı değil; istek kayıtta.'); return null;
        }
        return c.anchorFor($('cn-istek'))

  // ── programla konuşma (tools/canli-not-kopru.js) ─────────────────────────
  var istekNo = 0, bekleyenIstek = new Map();
  function kopru(ad, veri, sure) {
    return new Promise(function (coz, red) {
      var w = cerceve.contentWindow;
      if (!w || !program.basladi) { red(new Error('program yok')); return; }
      var no = ++istekNo;
      var t = setTimeout(function () { bekleyenIstek.delete(no); red(new Error('zaman aşımı')); }, sure || 8000);
      bekleyenIstek.set(no, function (v) {
        clearTimeout(t);
        if (v && v.hata) red(new Error(v.hata)); else coz(v);
      });
      w.postMessage({ cn: 1, tur: 'istek', ad: ad, no: no, veri: veri }, '*');
    });
  }
  window.addEventListener('message', function (e) {
    if (e.source !== cerceve.contentWindow) return;
    var m = e.data;
    if (!m || m.cn !== 1) return;

      var f = bekleyenIstek.get(m.no);
      if (f) { bekleyenIstek.delete(m.no); f(m.veri); }
      return;
    }
    if (m.tur === 'olay') programOlayi(m.ad, m.veri || {});

  function programOlayi(ad, v) {

    } else if (ad === 'hazir') {
      program.ortam = v.ortam || program.ortam; durumYaz();
      hazirBekle();
    } else if (ad === 'kisayol' && v.ad === 'kalem') {
      aracSec(arac === 'kalem' ? 'imlec' : 'kalem');
    } else if (ad === 'onay') {
      soruAc(v);
    } else if (ad === 'uyari') {
      bildir(v.mesaj || '');
    } else if (ad === 'indir') {
      indir(v);
    }
  }

  // Program giriş ve açılıştan geçince önceki durum geri yüklenir.
  function hazirBekle() {
    var deneme = 0;
    (function yokla() {
      kopru('durum').then(function (d) {

              .then(odakla);
          } else odakla();

      }, function () { if (++deneme < 1200) setTimeout(yokla, 1000); });
    })();
  }
  // Odaklı sayfa: program açılınca (Güncelle ve Yenile dâhil) bileşenin penceresi açılır —

    if (s.kutu[2] < 6 && s.kutu[3] < 6) {

  // Kart çizimin sağına, sığmazsa soluna, altına, üstüne açılır.
  function kartKonumla() {
    var kutu = CN.kutuBirlesim(taslak.sekiller);
    if (!kutu) return;
    var sahne = $('cn-sahne').getBoundingClientRect();
    var liste = $('cn-liste'), sag = sahne.width - (liste.hidden ? 0 : liste.offsetWidth);
    var g = kart.offsetWidth || 340, h = kart.offsetHeight || 170, ara = 14, kenar = 8;
    var adaylar = [
      [kutu[0] + kutu[2] + ara, kutu[1]],
      [kutu[0] - g - ara, kutu[1]],
      [kutu[0], kutu[1] + kutu[3] + ara],
      [kutu[0], kutu[1] - h - ara]
    ];
    var sigar = function (p) { return p[0] >= kenar && p[0] + g <= sag - kenar && p[1] >= kenar && p[1] + h <= sahne.height - kenar; };
    var p = adaylar.filter(sigar)[0] || adaylar[0];
    var x = Math.max(kenar, Math.min(sag - g - kenar, p[0]));
    var y = Math.max(kenar, Math.min(sahne.height - h - kenar, p[1]));
    kart.style.left = Math.round(x) + 'px';
    kart.style.top = Math.round(y) + 'px';

  // ── gönderim ────────────────────────────────────────────────────────────
  // Sıra: kayıt → Claude'a yorum → fotoğraf. Aynı belgeye yazımlar ardışık

  // başka ekrana geçse de not o ekranı taşısın.
  function gonder() {
    var metin = metinEl.value.trim();
    if (!taslak.sekiller.length) { kartDurum('Çizim yok.', true); return; }
    if (!metin) { kartDurum('Not boş.', true); metinEl.focus(); return; }
    if (!yetki.db || kayitDurum !== 'bagli') { kartDurum('Kayıt bağlı değil.', true); return; }
    var fotoSoz = kopru('foto', null, 30000).catch(function () { return null; });
    var id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    var r = katman.getBoundingClientRect();
    var not = {
      no: sonrakiNo(),
      sira: Date.now(),
      zaman: new Date().toISOString(),
      metin: metin,

  function base64(buf) {
    var b = new Uint8Array(buf), s = '';

  // ── kategoriler ─────────────────────────────────────────────────────────

      b.addEventListener('click', function () { kapali[k.kod] = !kapali[k.kod]; kapaliYaz(); kategoriDurum(k.kod); });
      kap.appendChild(s);
      KAT[k.kod] = { bolum: s, dugme: b, say: s.querySelector('.cn-kat-say'), liste: ol };
    });
  }
  kategoriKur();

  function listeCiz() {
    var kat = CN.kategorile(notlar);                 // her kategoride en yeni not en üstte
    var varolan = {};
    Array.prototype.forEach.call($('cn-notlar').querySelectorAll('.cn-not'), function (li) { varolan[li.id] = li; });
    kat.forEach(function (k) {
      var ol = KAT[k.kod].liste;
      k.notlar.forEach(function (n, i) {
        var li = varolan['not-' + n.id] || notSatiri(n);
        delete varolan['not-' + n.id];
        notGuncelle(li, n);
        if (ol.children[i] !== li) ol.insertBefore(li, ol.children[i] || null);   // başka kategoriden gelen satır TAŞINIR
        var eski = oncekiDurum[n.id];
        if (!ilkListe && eski && eski !== n.durum && n.durum !== 'bekliyor') bildir('Not ' + n.no + ' · ' + (CN.DURUMLAR[n.durum] || n.durum));
        oncekiDurum[n.id] = n.durum;
      });
    });
    Object.keys(varolan).forEach(function (k) { varolan[k].remove(); });
    kat.forEach(function (k) {
      var b = KAT[k.kod];
      b.say.textContent = k.notlar.length;
      b.bolum.hidden = !!k.bosGizli && !k.notlar.length;
      kategoriDurum(k.kod);
    });
    ilkListe = false;
    $('cn-bos').hidden = notlar.length > 0;
    var sayac = $('cn-sayac');
    sayac.textContent = notlar.length; sayac.setAttribute('data-bekleyen', notlar.filter(CN.acikNot).length);
    $('cn-ozet').textContent = '';
    if (!kart.hidden) $('cn-kart-no').textContent = 'Not ' + sonrakiNo();
  }

  // Sonucun büyük görüntüsü
  function buyukAc(n) {
    var yol = CN.sonucYolu(n);
    if (!yol) return;
    var img = $('cn-buyuk-resim');
    img.src = yol; img.alt = 'Not ' + n.no + ' sonucu';
    $('cn-buyuk-no').textContent = 'Not ' + n.no;
    $('cn-buyuk-yer').textContent = n.yer || '';
    $('cn-buyuk').hidden = false;
    setTimeout(function () { $('cn-buyuk-kapat').focus(); }, 0);
  }
  function buyukKapat() { $('cn-buyuk').hidden = true; }
  $('cn-buyuk-kapat').addEventListener('click', buyukKapat);
  $('cn-buyuk').addEventListener('click', function (e) { if (e.target === $('cn-buyuk')) buyukKapat(); });

  var onizZaman = 0;
  function cizimGoster(n) {
    while (onizG.firstChild) onizG.firstChild.remove();
    ((n.cizim && n.cizim.sekiller) || []).forEach(function (s) { onizG.appendChild(yolEl(s.d)); });
    clearTimeout(onizZaman);
    onizZaman = setTimeout(function () { while (onizG.firstChild) onizG.firstChild.remove(); }, 4000);
  }
  function iptalEt(n, b) {
    if (b.getAttribute('data-onay') !== '1') {
      b.setAttribute('data-onay', '1'); b.textContent = 'İptali onayla';
      setTimeout(function () { b.removeAttribute('data-onay'); b.textContent = 'İptal et'; }, 3500);
      return;
    }
    b.disabled = true;
    yetki.db.doc('notlar/' + n.id).update({ durum: 'iptal' }).then(function () { b.disabled = false; },
      function () { b.disabled = false; bildir('İptal yazılamadı.'); });
  }
  function yanitla(li) {
    var n = notBul(li.id.slice(4));
    var alan = li.querySelector('.cn-yanit textarea');
    var metin = alan.value.trim();
    if (!n || !metin) return;
    var btn = li.querySelector('.cn-yanit button');
    btn.disabled = true;
    yetki.db.doc('notlar/' + n.id).update({ yanit: metin, yanitZaman: new Date().toISOString(), durum: 'bekliyor' })
      .then(function () {
        alan.value = '';
        return claudeyaGonder(n.id, CN.yorumMetni({ no: n.no, yer: 'yanıt', metin: metin }), n.konu || null);
      }).then(function (gitti) { btn.disabled = false; bildir('Not ' + n.no + (gitti ? ': yanıt Claude’a gönderildi.' : ': yanıt kaydedildi.')); },
        function () { btn.disabled = false; bildir('Yanıt yazılamadı.'); });
  }

  function listeAcKapa(ac) {
    var liste = $('cn-liste');
    liste.hidden = !ac;
    $('cn-liste-ac').setAttribute('aria-expanded', ac ? 'true' : 'false');
    if (!kart.hidden) kartKonumla();
  }
  $('cn-liste-ac').addEventListener('click', function () { listeAcKapa($('cn-liste').hidden); });
  $('cn-liste-kapat').addEventListener('click', function () { listeAcKapa(false); });

  // ── programın sorusu (confirm / prompt) ─────────────────────────────────
  var soru = null;
  function soruAc(v) {
    soru = v;
    $('cn-sor-metin').textContent = v.mesaj;
    var deger = $('cn-sor-deger');
    deger.hidden = v.tur !== 'prompt';
    deger.value = v.varsayilan || '';
    $('cn-sor').hidden = false;
    setTimeout(function () { (v.tur === 'prompt' ? deger : $('cn-sor-evet')).focus(); }, 0);
  }
  function soruKapat(kabul) {
    if (!soru) return;
    var v = soru; soru = null;
    $('cn-sor').hidden = true;
    kopru('onay', { kabul: kabul, deger: $('cn-sor-deger').value }).then(function (c) {
      if (kabul && c && !c.oynadi) bildir('Onaylandı. İşlemi yineleyin.');
    }, function () {});
    try { cerceve.focus(); } catch (e) { /* yok */ }
    return v;
  }
  $('cn-sor-evet').addEventListener('click', function () { soruKapat(true); });
  $('cn-sor-hayir').addEventListener('click', function () { soruKapat(false); });
  $('cn-sor-deger').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); soruKapat(true); } });

  // ── indirme: programın kaydet/rapor dosyası ─────────────────────────────
  function dataBlob(url) {
    var m = /^data:([^;,]*)(;base64)?,(.*)$/.exec(url);
    if (!m) return new Blob([url]);
    var veri = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    var b = new Uint8Array(veri.length);
    for (var i = 0; i < veri.length; i++) b[i] = veri.charCodeAt(i);
    return new Blob([b], { type: m[1] || 'application/octet-stream' });
  }
  function indir(v) {
    var d = yetki.downloads;
    if (!d) { bildir('İndirme bu görünümde kapalı.'); return; }
    var veri = typeof v.veri === 'string' ? dataBlob(v.veri) : v.veri;
    d.save({ filename: v.ad, data: veri }).then(function () { bildir(v.ad + ' kaydedildi.'); }, function (e) {
      if (!e || e.code !== 'declined') bildir('İndirme yapılamadı.');
    });
  }

  // ── oturumu çağır ───────────────────────────────────────────────────────
  // Kullanıcı 2026-11-11: değişiklik için her seferinde yeni oturum açmak pratik değil
  // (*"HTML üzerinden Claude'a komutlar göndersin"*). Ölçüldü: sayfa oturum AÇAMIYOR —
  // oturum açan komutlar sayfaya kapalı; elle çalıştırılan görev de var olan oturumu
  // uyandırmıyor, depo bağlı olmayan yeni bir oturum açıyor (skill canli-not §1). Çalışan
  // yol yorum: düğme sayfaya BAĞLI oturumu Claude'a giden bir yorumla uyandırır ve çağrıyı
  // kayda yazar (oturum/cagri); oturum geldiğini oturum/aktif'i yeniden yazarak söyler
  // (çekirdek: cagriDurumu). Bağlı oturum yoksa çağrı gitmez: durum ve çaresi söylenir.
  var cagri = null, aktif = null, aktifOkundu = false, cagriZaman = null, cagriSuruyor = false;
  function cagriCiz() {
    var b = $('cn-cagir'), c = CN.cagriDurumu(cagri, aktif, Date.now());
    var surer = cagriSuruyor || c.durum === 'cagrildi';
    b.disabled = surer;
    b.setAttribute('aria-busy', surer ? 'true' : 'false');
    b.textContent = surer ? 'Çağrılıyor…' : 'Oturumu çağır';
    clearTimeout(cagriZaman);
    if (c.kalan > 0) cagriZaman = setTimeout(cagriCiz, c.kalan + 100);
    return c.durum;
  }
  function aktifGeldi(snap) {
    var once = CN.cagriDurumu(cagri, aktif, Date.now()).durum;
    aktif = snap && snap.exists ? (snap.data() || null) : null;
    var d = cagriCiz();
    if (aktifOkundu && once === 'cagrildi' && d === 'geldi') bildir('Oturum geldi.');
    aktifOkundu = true;
  }
  function oturumCagir() {
    if (cagriSuruyor || CN.cagriDurumu(cagri, aktif, Date.now()).durum === 'cagrildi') return;
    if (!yetki.db) { bildir('Kayıt bağlı değil.'); return; }
    var belge = yetki.db.doc('oturum/cagri');
    cagriSuruyor = true; cagriCiz();
    claudeYokla().then(function (baglanti) {
      var c = yetki.comments, engel = CN.cagriEngeli(c && typeof c.sendToClaude === 'function' ? baglanti : 'off');
      if (engel) throw { engel: engel, code: String(baglanti || 'off') };
      var bekleyen = notlar.filter(function (n) { return n.durum === 'bekliyor'; }).length;
      return c.anchorFor($('cn-cagir')).then(function (a) {
        return c.sendToClaude({ anchor: a, text: CN.cagriMetni({ bekleyen: bekleyen }) });
      });
    }).then(function (sonuc) {
      cagri = { zaman: new Date().toISOString(), onceki: String((aktif && aktif.zaman) || ''), konu: (sonuc && sonuc.threadId) || '' };
      bildir('Oturum çağrıldı.');
      return belge.set(cagri);
    }, function (e) {
      bildir((e && e.engel) || 'Oturum çağrılamadı.');
      if (e && e.code === 'claude_unavailable') claudeYokla();
      return belge.set({ zaman: new Date().toISOString(), durum: 'hata',
        hata: String((e && (e.code || e.message)) || 'hata').slice(0, 300) });
    }).catch(function () { /* kayıt yazılamadı: çağrının durumu bu görünümde kalır */ })
      .then(function () { cagriSuruyor = false; cagriCiz(); });
  }
  $('cn-cagir').addEventListener('click', oturumCagir);

  // ── klavye ──────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyN') { e.preventDefault(); aracSec(arac === 'kalem' ? 'imlec' : 'kalem'); return; }
    var yazi = e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName);
    if (e.key === 'Escape') {
      if (!$('cn-buyuk').hidden) { buyukKapat(); return; }
      if (!$('cn-sor').hidden) { soruKapat(false); return; }
      if (yazi && e.target === metinEl && metinEl.value.trim()) return;
      if (!kart.hidden && !metinEl.value.trim()) { kartKapat(); }
      aracSec('imlec');
      return;
    }
    if (!yazi && (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && taslak.sekiller.length) {
      e.preventDefault(); sonSekliSil();
    }
  });
  window.addEventListener('resize', function () { if (!kart.hidden) kartKonumla(); });

  // ── yeniden yayın: sayfa tazelenirken program durumu taşınır ────────────
  function anlikGoruntu() {
    var veri = { arac: arac };
    if (taslak.sekiller.length || metinEl.value.trim()) veri.taslak = { sekiller: taslak.sekiller.slice(), metin: metinEl.value };
    try {
      var w = cerceve.contentWindow, f = w && w._veSettingsBuildProjectData;
      if (program.hazir && typeof f === 'function') veri.proje = f();
    } catch (e) { /* çerçeveye erişim yok */ }
    return veri;
  }
  function basla(veri) {
    onceki = veri || {};
    if (onceki.taslak && onceki.taslak.sekiller && onceki.taslak.sekiller.length) {
      onceki.taslak.sekiller.forEach(function (s) { taslak.sekiller.push(s); taslakG.appendChild(yolEl(s.d)); });
      $('cn-geri').disabled = false;
      metinEl.value = onceki.taslak.metin || '';
      kartAc();
    }
    yetkileriAl();
    durumYaz();
    setTimeout(programBaslat, 6000);   // kayıt hiç cevap vermezse program yine açılır
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(anlikGoruntu); } catch (e) { /* yok */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(basla);
  else basla((hot && hot.data) || {});
})();
</script>
