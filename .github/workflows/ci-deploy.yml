name: CI + Deploy

on:
  push:
    branches:
      - main
  # PR'da da koş — YALNIZCA "test" job'u (aşağıdaki build/deploy job'ları
  # pull_request olayında atlanır). Önceden CI sadece main'e push'ta koşuyordu;
  # teslim akışı "PR aç ve merge et" olduğu için kırık kod ancak MERGE EDİLDİKTEN
  # SONRA fark ediliyordu. Kapı artık merge'den önce.
  pull_request:
    branches:
      - main
  # Elle tetik — başarısız/atlanan bir Pages deploy'unu Actions sekmesinden
  # "Run workflow" ile YENİ bir çalıştırma olarak tetiklemek için (kod değişikliği
  # gerektirmez). Not: başarısız deploy için mevcut çalıştırmayı "Re-run" etmek de
  # artık güvenli — upload ayrı job'da olduğundan artifact tekrarlanmaz.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # aynı run'da kalan "github-pages" artifact'ını silebilmek için

concurrency:
  # GitHub Pages aynı anda TEK deployment'a izin verir → main akışı "pages"
  # grubunda sırayla koşar ve iptal edilmez. PR koşumları bu gruba GİRMEZ:
  # girseydi her açık PR testi bir deploy'u kuyrukta bekletirdi. Her PR kendi
  # grubunda koşar ve dala yeni push gelince eskisi iptal edilir.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      # Görüntüleyici kopyaları js/'ten geride mi? (viewer/sync.js'in kendi
      # CI kapısı — dosyayı DEĞİŞTİRMEZ, yalnız fark var mı söyler.)
      - name: Görüntüleyici senkron kapısı
        run: npm run sync:viewer -- --check

      # MFSim_Olcum_Goruntuleyici.html git'e DÂHİL ve elle üretiliyor; dağıtım
      # bu dosyanın indirilmesiyle oluyor. Kaynak değişip build unutulursa
      # kullanıcı bayat dosya indirir. viewer/build.js deterministik olduğundan
      # yeniden üretip diff'e bakmak güvenilir bir tazelik kapısıdır.
      # (MFSim_Code.html .gitignore'da olduğu için ona bakılmaz.)
      - name: Dağıtım dosyası taze mi (MFSim_Olcum_Goruntuleyici.html)
        run: |
          npm run build:viewer
          if ! git diff --exit-code -- MFSim_Olcum_Goruntuleyici.html; then
            echo "::error::MFSim_Olcum_Goruntuleyici.html kaynaklarla uyumsuz. 'npm run build:viewer' çalıştırıp sonucu commit'leyin."
            exit 1
          fi

  # Pages artifact'ını ÜRETEN job. Deploy'dan AYRI tutulur: böylece başarısız bir
  # deploy'u "re-run" etmek upload'ı TEKRARLAMAZ. (Upload ile deploy aynı job'da
  # olduğunda, deploy'u yeniden çalıştırmak aynı run'da ikinci bir "github-pages"
  # artifact'ı oluşturuyor ve deploy-pages "Artifact count is 2" hatası veriyordu.)
  build:
    needs: test
    # PR'da Pages artifact'ı ÜRETİLMEZ: PR'ın işi doğrulama, yayın değil.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (GITHUB_RUN_ID deploy-status.js'e gömülür)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create site directory
        run: |
          mkdir -p _site/pwa
          cp MFSim_Code.html _site/index.html
          cp pwa/manifest.json _site/pwa/manifest.json
          cp pwa/icon.svg _site/pwa/icon.svg
          cp pwa/sw.js _site/pwa/sw.js
          # Harici varlıklar (ör. örnek topoloji görselleri) — göreli yolla
          # referans verilenler Pages'e aynı yapıda kopyalanır.
          if [ -d assets ]; then cp -r assets _site/assets; fi
          touch _site/.nojekyll

      - name: Generate version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node gen-version.js _site

      # "Re-run all jobs" güvenliği: bu run'ın önceki denemesinden kalmış bir
      # "github-pages" artifact'ı varsa, upload'dan ÖNCE sil. Aksi halde ikinci
      # upload 2. artifact'ı üretir ve deploy "Artifact count is 2" ile düşer.
      # (API bu run ile sınırlı — başka çalıştırmaların artifact'larına dokunmaz.)
      - name: Remove stale github-pages artifact (re-run güvenliği)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' 2>/dev/null || true)
          for id in $ids; do
            echo "Bayat github-pages artifact siliniyor: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    # PR'dan yayına çıkılmaz.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # GitHub Pages backend zaman zaman geçici "Deployment failed, try again
      # later." hatası verir — özellikle art arda hızlı merge/re-run'larda önceki
      # bir Pages deployment'ı "in progress" takılıp yenilerini bloke ederse
      # (Pages aynı anda tek deployment'a izin verir; takılı olan ~10 dk'da
      # temizlenir). Bu yüzden deploy KADEMELİ bekleyişle 3 kez denenir.
      # Adımlar ARTIFACT ÜRETMEZ (yalnız mevcut "github-pages" artifact'ını yayına
      # alır) → tekrar denemek güvenli, artifact sayısını ARTIRMAZ.
      - name: Deploy to GitHub Pages (deneme 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Bekle (60 sn)
        if: steps.d1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (deneme 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Bekle (180 sn)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 180

      # Son deneme: continue-on-error YOK → hâlâ düşerse job gerçekten fail olur
      # (kalıcı bir sorunu gizlemez). Yalnız ilk iki deneme de düştüyse çalışır.
      - name: Deploy to GitHub Pages (deneme 3 — son)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
