name: CI + Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # TetGen WASM (AGPL-3.0) toolchain sürümü — emsdk cache anahtarı.
  # Yerelde bu sürümle (emcc 5.0.7) derlenip doğrulandı; CI ile hizalı tutulur.
  EMSDK_VERSION: '5.0.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # ── TetGen WASM (AGPL-3.0) — emscripten ile derle ────────────────────
      # Cache'li emsdk: ilk çalıştırmada indirir (~300MB), sonra cache'ten gelir.
      # build:wasm:tetgen, vendor/tetgen/tetgen-wasm.{js,wasm} üretir; sonraki
      # "npm run build" bunları MFSim_Code.html'e inline eder.
      # AGPL NOTU: WASM dağıtıldığında AGPL-3.0 yükümlülükleri tetiklenir
      # (vendor/tetgen/NOTICE.md). Bu opt-in CI adımı bilinçli bir karardır.
      - name: Setup emscripten (TetGen WASM)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'

      - name: Build TetGen WASM (AGPL-3.0, opt-in)
        run: npm run build:wasm:tetgen

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # TetGen WASM'ı deploy build'inde de üret → canlı sitede "● aktif".
      # AGPL-3.0: yayınlanan site bu yükümlülüklere tabidir (NOTICE.md).
      - name: Setup emscripten (TetGen WASM)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'

      - name: Build TetGen WASM (AGPL-3.0, opt-in)
        run: npm run build:wasm:tetgen

      - name: Build (GITHUB_RUN_ID deploy-status.js'e gömülür)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create site directory
        run: |
          mkdir -p _site/pwa
          cp MFSim_Code.html _site/index.html
          cp pwa/manifest.json _site/pwa/manifest.json
          cp pwa/icon.svg _site/pwa/icon.svg
          cp pwa/sw.js _site/pwa/sw.js
          touch _site/.nojekyll

      - name: Generate version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node gen-version.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
