name: CI + Deploy

on:
  push:
    branches:
      - main
  # PR'da da koş — YALNIZCA "test" job'u (aşağıdaki build/deploy job'ları
  # pull_request olayında atlanır). Önceden CI sadece main'e push'ta koşuyordu;
  # teslim akışı "PR aç ve merge et" olduğu için kırık kod ancak MERGE EDİLDİKTEN
  # SONRA fark ediliyordu. Kapı artık merge'den önce.
  pull_request:
    branches:
      - main
  # Elle tetik — başarısız/atlanan bir Pages deploy'unu Actions sekmesinden
  # "Run workflow" ile YENİ bir çalıştırma olarak tetiklemek için (kod değişikliği
  # gerektirmez). Not: başarısız deploy için mevcut çalıştırmayı "Re-run" etmek de
  # artık güvenli — upload ayrı job'da olduğundan artifact tekrarlanmaz.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # aynı run'da kalan "github-pages" artifact'ını silebilmek için

# ZAMAN SINIRI (her job'da timeout-minutes): GitHub varsayılanı 360 DAKİKA. Main
# akışı aşağıdaki 'pages' grubunda ve cancel-in-progress:false olduğu için, ASILI
# kalan tek bir adım ardındaki bütün deploy'ları o süre boyunca kuyrukta tutar.
# 2026-08-19'da tam olarak bu oldu: 'Chromium kur' adımı — normalde 1 dk 40 sn —
# hiçbir test gövdesine ulaşmadan 30 dakikadan uzun asılı kaldı ve koşu ancak ELLE
# iptal edilerek bitti; iptal oturana kadar 'Re-run' da kabul edilmiyordu. Sınır
# konunca aynı durum kendiliğinden kırmızıya döner, grup boşalır ve yeniden
# çalıştırma işe yarar. Değerler son yeşil koşunun ÖLÇÜLEN sürelerinin katıdır.
concurrency:
  # GitHub Pages aynı anda TEK deployment'a izin verir → main akışı "pages"
  # grubunda sırayla koşar ve iptal edilmez. PR koşumları bu gruba GİRMEZ:
  # girseydi her açık PR testi bir deploy'u kuyrukta bekletirdi. Her PR kendi
  # grubunda koşar ve dala yeni push gelince eskisi iptal edilir.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # ölçülen süre: 1 dk 17 sn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      # Görüntüleyici kopyaları js/'ten geride mi? (viewer/sync.js'in kendi
      # CI kapısı — dosyayı DEĞİŞTİRMEZ, yalnız fark var mı söyler.)
      - name: Görüntüleyici senkron kapısı
        run: npm run sync:viewer -- --check

      # MFSim_Olcum_Goruntuleyici.html git'e DÂHİL ve elle üretiliyor; dağıtım
      # bu dosyanın indirilmesiyle oluyor. Kaynak değişip build unutulursa
      # kullanıcı bayat dosya indirir. viewer/build.js deterministik olduğundan
      # yeniden üretip diff'e bakmak güvenilir bir tazelik kapısıdır.
      # (MFSim_Code.html .gitignore'da olduğu için ona bakılmaz.)
      - name: Dağıtım dosyası taze mi (MFSim_Olcum_Goruntuleyici.html)
        run: |
          npm run build:viewer
          if ! git diff --exit-code -- MFSim_Olcum_Goruntuleyici.html; then
            echo "::error::MFSim_Olcum_Goruntuleyici.html kaynaklarla uyumsuz. 'npm run build:viewer' çalıştırıp sonucu commit'leyin."
            exit 1
          fi

  # YAYINLANAN ÜRÜNÜ AÇAN kapı — birim testlerin göremediği sınıf buradan geçer.
  #
  # 2026-08 olayı: js/results.js'e giren ham "</script>" dizisi index.html'de
  # zararsızdı ama MFSim_Code.html'de <script> bloğunu erken kapattı; ekrana ham
  # kod döküldü ve ana ekranda hiçbir yere tıklanamadı. Birim testler js/
  # dosyalarını DOĞRUDAN yükler, tek dosyaya hiç bakmaz; o tarihte tüm E2E
  # testleri de index.html'i açıyordu. Yani yayınlanan artefakt hiçbir otomatik
  # kapıdan geçmiyordu ve bozukluk ilk kez KULLANICIDA görüldü.
  #
  # Kapsam bilerek dar: yalnız İKİ ürün dosyası (MFSim_Code.html ve
  # MFSim_Olcum_Goruntuleyici.html). Tüm E2E takımı yerel bir araç olarak kalıyor
  # (npm run test:e2e); buradaki iş "dağıtılan şey açılıyor mu" sorusu.
  e2e-urun:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # ölçülen süre: 3 dk 06 sn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (iki ürün dosyası)
        run: npm run build:all

      # ASILMAYA KARŞI: takılan şey Chromium indirmesi DEĞİL, `--with-deps`
      # içindeki apt-get update. 2026-08-19'da iki main koşusu üst üste burada
      # asıldı; loglar runner'ın apt aynasını gösteriyor:
      #   Ign: http://azure.archive.ubuntu.com/ubuntu noble InRelease   (x4)
      #   Hit: https://archive.ubuntu.com/ubuntu noble InRelease        (yedeğe düştü)
      #   Ign: http://azure.archive.ubuntu.com .../main amd64 Packages  ← son satır
      #   …19 dakika sessizlik… ##[error]The operation was canceled.
      # Yani apt, azure aynasından Packages indekslerini çekerken kara deliğe
      # giriyor; Chromium ikilisi indirilmeye HİÇ başlamıyor. Aynı adım aynı
      # dakikalarda PR koşusunda 3 dk 05 sn'de bitti — ayna runner'a göre değişiyor.
      # İki katmanlı çare: (1) azure aynasını genel aynayla değiştir, (2) her
      # denemeyi süreyle sınırla ve yeniden dene. Sağlıklı koşuda ilk deneme
      # ~1 dk 40 sn'de biter, hiçbir şey değişmez. En kötü hâl 3×5 = 15 dk,
      # job sınırının (20 dk) altında.
      - name: Chromium kur
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f" || true
          done
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for deneme in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Chromium kurulumu $deneme. denemede asıldı/başarısız — yeniden deneniyor"
            sleep 5
          done
          echo "::error::Chromium kurulumu üç denemede de tamamlanamadı"
          exit 1

      - name: Ürün açılış kapısı
        run: npx playwright test tests/e2e/published.spec.js tests/e2e/viewer.spec.js

      - name: Başarısızlık izlerini yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-urun-izleri
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Pages artifact'ını ÜRETEN job. Deploy'dan AYRI tutulur: böylece başarısız bir
  # deploy'u "re-run" etmek upload'ı TEKRARLAMAZ. (Upload ile deploy aynı job'da
  # olduğunda, deploy'u yeniden çalıştırmak aynı run'da ikinci bir "github-pages"
  # artifact'ı oluşturuyor ve deploy-pages "Artifact count is 2" hatası veriyordu.)
  build:
    # Ürün kapısı da geçmeden yayın YOK — açılışta kırık bir dosya Pages'e
    # gitmesin.
    needs: [test, e2e-urun]
    # PR'da Pages artifact'ı ÜRETİLMEZ: PR'ın işi doğrulama, yayın değil.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10          # ölçülen süre: 12 sn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (GITHUB_RUN_ID deploy-status.js'e gömülür)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create site directory
        run: |
          mkdir -p _site/pwa
          cp MFSim_Code.html _site/index.html
          cp pwa/manifest.json _site/pwa/manifest.json
          cp pwa/icon.svg _site/pwa/icon.svg
          # SW KOKE kopyalanir: varsayilan kapsami kendi dizinidir, _site/pwa/
          # altinda olsaydi uygulama sayfasini hic kontrol etmezdi (bkz. sw.js).
          cp sw.js _site/sw.js
          # Harici varlıklar (ör. örnek topoloji görselleri) — göreli yolla
          # referans verilenler Pages'e aynı yapıda kopyalanır.
          if [ -d assets ]; then cp -r assets _site/assets; fi
          # STEP okuyucusunun .wasm'i (7.3 MB) — build.js vendor JS'lerini inline
          # ediyor ama bir WASM IKILISI script etiketine gomulemez. Yapisal Analiz
          # Geometri bileseni bunu calisma aninda 'vendor/occt-import-js.wasm'
          # yolundan cekiyor (js/structural-model.js VE_STR_OCCT_WASM_PATHS), o
          # yuzden Pages'te de ayni goreli yolda durmali. Tek dosyaya GOMULMUYOR:
          # boyut ve LGPL-2.1 ayni kapiya cikiyor (bkz. CLAUDE.md).
          mkdir -p _site/vendor
          cp vendor/occt-import-js.wasm _site/vendor/occt-import-js.wasm
          cp vendor/license.occt.txt _site/vendor/license.occt.txt
          cp vendor/license.occt-import-js.txt _site/vendor/license.occt-import-js.txt
          # TetGen ağ üretecinin .wasm'i (~0.7 MB) — occt-import-js.wasm ile AYNI
          # gerekçe: gömülü (js/structural-tetgen-wasm.js) PRİMER yol, bu dosya
          # yalnız DecompressionStream'i olmayan eski tarayıcı yedeği + AGPL-3
          # kaynağın (vendor/tetgen-src/) yanında dağıtılan ikili.
          cp vendor/tetgen-wasm.wasm _site/vendor/tetgen-wasm.wasm
          cp vendor/license.tetgen.txt _site/vendor/license.tetgen.txt
          touch _site/.nojekyll

      - name: Generate version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node gen-version.js _site

      # "Re-run all jobs" güvenliği: bu run'ın önceki denemesinden kalmış bir
      # "github-pages" artifact'ı varsa, upload'dan ÖNCE sil. Aksi halde ikinci
      # upload 2. artifact'ı üretir ve deploy "Artifact count is 2" ile düşer.
      # (API bu run ile sınırlı — başka çalıştırmaların artifact'larına dokunmaz.)
      - name: Remove stale github-pages artifact (re-run güvenliği)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' 2>/dev/null || true)
          for id in $ids; do
            echo "Bayat github-pages artifact siliniyor: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    # PR'dan yayına çıkılmaz.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15          # ölçülen süre: 9 sn + yeniden deneme bekleyişleri
    steps:
      # GitHub Pages backend zaman zaman geçici "Deployment failed, try again
      # later." hatası verir — özellikle art arda hızlı merge/re-run'larda önceki
      # bir Pages deployment'ı "in progress" takılıp yenilerini bloke ederse
      # (Pages aynı anda tek deployment'a izin verir; takılı olan ~10 dk'da
      # temizlenir). Bu yüzden deploy KADEMELİ bekleyişle 3 kez denenir.
      # Adımlar ARTIFACT ÜRETMEZ (yalnız mevcut "github-pages" artifact'ını yayına
      # alır) → tekrar denemek güvenli, artifact sayısını ARTIRMAZ.
      - name: Deploy to GitHub Pages (deneme 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Bekle (60 sn)
        if: steps.d1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (deneme 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Bekle (180 sn)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 180

      # Son deneme: continue-on-error YOK → hâlâ düşerse job gerçekten fail olur
      # (kalıcı bir sorunu gizlemez). Yalnız ilk iki deneme de düştüyse çalışır.
      - name: Deploy to GitHub Pages (deneme 3 — son)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
