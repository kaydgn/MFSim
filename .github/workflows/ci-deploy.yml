name: CI + Deploy

on:
  push:
    branches:
      - main
  # Elle tetik — başarısız/atlanan bir Pages deploy'unu Actions sekmesinden
  # "Run workflow" ile yeniden çalıştırmak için (kod değişikliği gerektirmez).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ci

  deploy:
    needs: test
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (GITHUB_RUN_ID deploy-status.js'e gömülür)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create site directory
        run: |
          mkdir -p _site/pwa
          cp MFSim_Code.html _site/index.html
          cp pwa/manifest.json _site/pwa/manifest.json
          cp pwa/icon.svg _site/pwa/icon.svg
          cp pwa/sw.js _site/pwa/sw.js
          touch _site/.nojekyll

      - name: Generate version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node gen-version.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      # GitHub Pages backend zaman zaman "Deployment failed, try again later."
      # geçici hatası verir (özellikle art arda hızlı merge'lerde deploy'lar
      # çakışınca). İlk deneme başarısızsa kısa bekleyişten sonra bir kez
      # daha denenir; ikisi de düşerse job gerçekten fail olur.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
